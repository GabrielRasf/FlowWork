<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/treinos.css">
    <link rel="stylesheet" type="text/css" href="../css/root.css">
    <title>Treinos</title>
</head>

<body>
    <section>
        <nav>
            <div class="div-entrar-inscrever">
                <a class="button-geral button-entrar" href="explorar.html">Explorar</a>
                <a class="button-geral button-inscrever" href="criar.html">Criar</a>
            </div>
        </nav>
    </section>

    <main>
        <section>
            <div class="div-container">
                <div class="div-treinos">
                    <div class="logo-slogan-buttons">
                        <h1><a href="index.html">GymFlow</a></h1>
                    <h2>Filtros</h2>
                    <div class="conteudo-treinos">
                        
                        <div class="filtros">
                            <ol>
                                <li>
                                    <input class="filtro" type="text" id="filtro1" name="filtro1" placeholder="Filtro 1">
                                </li>
                                <li>
                                    <input class="filtro" type="text" id="filtro2" name="filtro2" placeholder="Filtro 2">
                                </li>
                                <li>
                                    <input class="filtro" type="text" id="filtro3" name="filtro3" placeholder="Filtro 3">
                                </li>
                                <li>
                                    <input class="filtro" type="text" id="filtro4" name="filtro4" placeholder="Filtro 4">
                                </li>
                                <li>
                                    <input class="filtro" type="text" id="filtro5" name="filtro5" placeholder="Filtro 5">
                                </li>
                                <div class="buttons-limpar-filtrar-criar">
                                    <div class="button-limpar-filtrar">
                                        <button class="button-limpar">Limpar</button>
                                        <button class="button-filtrar">Filtrar</button>
                                    </div>
                                    <button class="button-criar-treino">Criar treino</button>
                                </div>
                            </ol>
                        </div>

                        <div class="treinos-boxs">
                            <div class="div-box-treinos-info">
                                <div class="box-treinos"></div>
                                <div class="info-treino">
                                    <h3 class="titulo-treino"><span>Treino - Superior</span></h3>
                                    <p class="criador-treino"><span>Criado por: Pedro Ferreira</span></p>
                                    <p class="avaliacao-treino"><span>Avaliação: ⭐⭐⭐⭐☆</span></p>
                                </div>
                            </div>
                            <div class="div-box-treinos-info">
                                <div class="box-treinos"></div>
                                <div class="info-treino">
                                    <h3 class="titulo-treino"><span>Treino - Inferior</span></h3>
                                    <p class="criador-treino"><span>Criado por: Maria Silva</span></p>
                                    <p class="avaliacao-treino"><span>Avaliação: ⭐⭐⭐⭐⭐</span></p>
                                </div>
                            </div>
                            <div class="div-box-treinos-info">
                                <div class="box-treinos"></div>
                                <div class="info-treino">
                                    <h3 class="titulo-treino"><span>Treino - Core</span></h3>
                                    <p class="criador-treino"><span>Criado por: João Souza</span></p>
                                    <p class="avaliacao-treino"><span>Avaliação: ⭐⭐⭐☆☆</span></p>
                                </div>
                            </div>
                            <div class="div-box-treinos-info">
                                <div class="box-treinos"></div>
                                <div class="info-treino">
                                    <h3 class="titulo-treino"><span>Treino - Cardio</span></h3>
                                    <p class="criador-treino"><span>Criado por: Ana Paula</span></p>
                                    <p class="avaliacao-treino"><span>Avaliação: ⭐⭐⭐⭐☆</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <section>
        <footer>
            <span class="footer">Fomento</span>
        </footer>
    </section>
</body>

</html>
