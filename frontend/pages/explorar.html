<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Treinos - Flow Work</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="stylesheet" href="../css/explorar.css">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <div class="logo-container">
                    <a href="index.html">
                        <i class="fa-solid fa-dumbbell"></i>Flow Work
                    </a>
                </div>
                <div class="botoes-nav">
                    <a href="index.html" class="button-geral button-inicio">Início</a>
                    <a href="criar.html" class="button-geral button-sair">Criar</a>
                </div>
            </nav>
        </header>

        <main>
            <section class="catalogo">
                <h1 class="catalogo-titulo">Explorar</h1>
                <div class="catalogo-abas" role="tablist" aria-label="Tipo de catálogo">
                    <button type="button" class="button-geral button-inicio" id="aba-exercicios" role="tab" aria-selected="true" aria-controls="resultados">Exercícios</button>
                    <button type="button" class="button-geral" id="aba-treinos" role="tab" aria-selected="false" aria-controls="resultados">Treinos</button>
                </div>

                <form id="form-busca" class="busca-catalogo" role="search">
                    <label for="busca" id="rotulo-busca">Buscar exercício...</label>
                    <input id="busca" name="busca" type="search" autocomplete="off" placeholder="Buscar exercício...">
                </form>

                <div class="atalhos" id="atalhos" aria-label="Formas de explorar"></div>

                <button type="button" class="button-geral button-inicio abrir-filtros" id="abrir-filtros" aria-expanded="false" aria-controls="painel-filtros">Filtrar</button>

                <form id="painel-filtros" class="painel-filtros">
                    <div class="campo-filtro filtro-exercicio">
                        <label for="filtro-grupo">Grupo muscular</label>
                        <select id="filtro-grupo" name="grupo">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="campo-filtro filtro-exercicio">
                        <label for="filtro-tipo">Tipo</label>
                        <select id="filtro-tipo" name="tipo">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="campo-filtro filtro-exercicio">
                        <label for="filtro-equipamento">Equipamento</label>
                        <select id="filtro-equipamento" name="equipamento">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="campo-filtro filtro-treino">
                        <label for="filtro-foco">Grupo muscular</label>
                        <select id="filtro-foco" name="foco">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="campo-filtro filtro-treino">
                        <label for="filtro-nivel">Nível</label>
                        <select id="filtro-nivel" name="nivel">
                            <option value="">Todos</option>
                        </select>
                    </div>
                    <div class="campo-filtro filtro-treino">
                        <label for="filtro-equipamento-treino">Equipamento</label>
                        <select id="filtro-equipamento-treino" name="equipamento-treino">
                            <option value="">Todos</option>
                            <option value="Sem equipamentos">Sem equipamentos</option>
                            <option value="Com equipamentos">Com equipamentos</option>
                        </select>
                    </div>
                    <div class="campo-filtro">
                        <label for="filtro-ordem">Ordenar</label>
                        <select id="filtro-ordem" name="ordem"></select>
                    </div>
                    <div class="campo-filtro campo-limpar">
                        <button type="button" class="button-geral button-sair" id="limpar-filtros">Limpar filtros</button>
                    </div>
                </form>

                <p id="contador" class="contador-resultados" role="status" aria-live="polite"></p>
                <div id="resultados" class="carousel-track" aria-live="polite"></div>
                <button type="button" class="button-geral button-inicio carregar-mais" id="carregar-mais" hidden>Carregar mais</button>
            </section>
        </main>
    </div>

    <section class="modals">
        <div id="modal-ficha" class="modal">
            <div class="modal-content">
                <span class="fechar" id="fechar-ficha">&times;</span>
                <h2 id="modal-titulo"></h2>
                <p class="descricao-treino" id="modal-descricao"></p>
                <div id="modal-blocos"></div>
                <section class="comentarios-ficha" id="secao-comentarios">
                    <h3>Comentários</h3>
                    <div id="lista-comentarios"></div>
                    <form id="form-comentario" class="form-comentario">
                        <input id="comentario-autor" type="text" maxlength="80" placeholder="Seu nome" autocomplete="nickname">
                        <textarea id="comentario-texto" maxlength="500" placeholder="Escreva um comentário"></textarea>
                        <button type="submit" class="button-geral button-inicio" id="enviar-comentario">Publicar comentário</button>
                        <p id="comentario-aviso" class="comentario-aviso"></p>
                    </form>
                </section>
            </div>
        </div>
    </section>

    <script type="module" src="../js/explorar.js"></script>
</body>
</html>
